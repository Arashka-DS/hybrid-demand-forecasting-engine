services:
  postgres_dw:
    image: postgres:15-alpine
    container_name: liquidity_postgres
    environment:
      POSTGRES_USER: dw_admin
      POSTGRES_PASSWORD: dw_password
      POSTGRES_DB: liquidity_dw
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dw_admin -d liquidity_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

  forecaster_api:
    build: .
    container_name: forecaster_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_dw
      - DB_USER=dw_admin
      - DB_PASSWORD=dw_password
      - DB_NAME=liquidity_dw
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    command: >
      bash -c "python src/run_fintech_liquidity.py && 
               python src/run_qcommerce_demand.py && 
               uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres_dw:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: forecaster_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - forecaster_api

  grafana:
    image: grafana/grafana:10.4.2
    container_name: forecaster_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  metabase_db:
    image: postgres:15
    container_name: metabase_internal_db
    environment:
      POSTGRES_USER: mb_user
      POSTGRES_PASSWORD: mb_password
      POSTGRES_DB: metabase_app
    volumes:
      - metabase_pg_data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:latest
    container_name: forecaster_metabase
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase_app
      - MB_DB_PORT=5432
      - MB_DB_USER=mb_user
      - MB_DB_PASS=mb_password
      - MB_DB_HOST=metabase_db
    depends_on:
      metabase_db:
        condition: service_started
    depends_on:
      postgres_dw:
        condition: service_healthy

volumes:
  pg_dw_data:
  metabase_pg_data:
