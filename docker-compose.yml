version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitor
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - forecasting_api

  postgres_ts:
    image: postgres:15-alpine
    container_name: time_series_db
    environment:
      POSTGRES_USER: ts_admin
      POSTGRES_PASSWORD: ts_password
      POSTGRES_DB: liquidity_warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_monitor
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - postgres_ts

  metabase:
    image: metabase/metabase:latest
    container_name: metabase_liquidity
    ports:
      - "3001:3000" # Mapped to 3001 to avoid clashing with Grafana on 3000
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=liquidity_warehouse
      - MB_DB_PORT=5432
      - MB_DB_USER=ts_admin
      - MB_DB_PASS=ts_password
      - MB_DB_HOST=postgres_ts
    depends_on:
      - postgres_ts

  forecasting_api:
    build: .
    container_name: forecasting_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres_ts
    depends_on:
      - postgres_ts
